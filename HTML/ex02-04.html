<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      /* 로컬로 접속한 이들에게 폰트 제공 */
      @font-face {
        font-family: "MyFont";
        src: url("./GalmuriMono9.ttf") format("truetype");
      }
      /* format("opentype"); | → OTP일 때*/
      ul {
        list-style-type: decimal;
      }

      ul li {
        background-color: cadetblue;
        color: white;
        margin: 3px;
      }
    </style>
  </head>
  <body>
    <h1>input 응용</h1>
    <hr />
    <a href="index.html">홈으로</a>

    <h1 style="font-family: MyFont">리스트 정리</h1>
    <h2
      style="
        font-family:
          Galmuri9 Regular,
          Arial,
          Helvetica,
          sans-serif;
      "
    >
      순서가 있는 리스트(Ordered list, list itme)
    </h2>

    <h3><strong>커피</strong></h3>
    <!-- ol의 속성 type, start, value -->
    <ol type="a" start="5">
      <li style="background-color: antiquewhite">아메리카노</li>
      <li style="color: mediumblue">아이스 아메리카노</li>
      <li value="1">라떼</li>
      <li style="background-color: antiquewhite">아샷추</li>
      <li>카푸치노</li>
    </ol>

    <!-- 개인 컴퓨터에서 폰트를 꺼내는 건 잘 사용 안 함 -->
    <h2
      style="
        font-family:
          Galmuri9 Regular,
          Arial,
          Helvetica,
          sans-serif;
      "
    >
      순서가 없는 리스트(Unordered list, list itme)
    </h2>
    <ul>
      <li>사과</li>
      <li>복숭아</li>
      <li>수박</li>
      <li>포도</li>
      <li>바나나</li>
    </ul>
  </body>
</html>
