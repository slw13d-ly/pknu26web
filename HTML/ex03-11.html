<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CDN(Content Delivery Network, 콘텐츠 전송 네트워크)  -->
    <!-- : 지리적으로 분산된 여러 서버에 웹 콘텐츠(이미지, 영상, HTML 등)를 복사하여 저장한 뒤, 사용자에게
    가장 가까운 서버에서 빠르게 데이터를 전송하는 시스템 -->
    <title>CDN, 구글 폰트</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <style>
      body {
        font-family: "Do Hyeon", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      .nanum-pen-script-regular {
        font-family: "Nanum Pen Script", cursive;
        font-weight: 400;
        font-style: normal;
      }

      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body>
    <h1>CDN, 구글 폰트</h1>
    <hr />
    <a href="index.html">홈으로</a><br />

    <h3>엑스포 안내</h3>
    <p>반갑습니다.</p>
    <span>난 신경쓰지마.</span>
    <p>책자를 배부하고 있습니다.</p>
    <p>안내데스크를 활용하시길 바랍니다.</p>

    <!-- ul>(li>p)*2^^p{9월에는 가을 이벤트가 시작됩니다.} -->
    <ul>
      <li>
        <span>안내: 생략</span>
        <p>주중에는 정오 이벤트가 있습니다.</p>
      </li>
      <li>
        <p>안내:</p>
        <span>주의사항: 내용이 없습니다.</span>
        <p>주말에는 자정 이벤트가 있습니다.</p>
      </li>
    </ul>
    <p class="nanum-pen-script-regular">9월에는 가을 이벤트가 시작됩니다.</p>
    <hr />

    <!-- SVG : 화질에 영향 받지 않는 백터 이미지. 이미지의 크기를 늘리거나 줄이더라도
    화질에 영향 받지 않는 이미지, 스타일 수정이 쉬움. -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="#000"
    >
      <path
        d="m109-531-85-85q92-89 210-136.5T480-800q128 0 246 47.5T936-616l-85 85q-75-72-171-110.5T480-680q-104 0-200 38.5T109-531Zm169 169-84-84q59-55 132.5-84.5T480-560q80 0 153.5 29.5T766-446l-84 84q-42-38-93.5-58T480-440q-57 0-108.5 20T278-362Zm145.5 178.5Q400-207 400-240t23.5-56.5Q447-320 480-320t56.5 23.5Q560-273 560-240t-23.5 56.5Q513-160 480-160t-56.5-23.5Z"
      />
    </svg>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="#FFD700"
    >
      <path
        d="M409-149q-29-29-29-71t29-71q29-29 71-29t71 29q29 29 29 71t-29 71q-29 29-71 29t-71-29ZM254-346l-84-86q59-59 138.5-93.5T480-560q92 0 171.5 35T790-430l-84 84q-44-44-102-69t-124-25q-66 0-124 25t-102 69ZM84-516 0-600q92-94 215-147t265-53q142 0 265 53t215 147l-84 84q-77-77-178.5-120.5T480-680q-116 0-217.5 43.5T84-516Z"
      />
    </svg>

    <h3>여기서부터 아이콘</h3>
    <div class="material-symbols-outlined">wifi</div>
    <div class="material-symbols-outlined">cable</div>
    <div class="material-symbols-outlined">light_mode</div>
    <div class="material-symbols-outlined">charger</div>
  </body>
</html>
