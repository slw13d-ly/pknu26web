<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js</title>
    <script>
      // ver → const, let
      const a1 = 1;
      const a2 = 2;
      const a3 = "3";
      const a4 = "안녕";
      const insa = "안녕하세요. 계산하기 좋은 날이에요.";
      //=====================
      console.log(insa + a1 + a2); // 숫자 + 문자 계산 시 숫자를 문자로 변환.
      console.log(a1 + a2);
      alert(insa + a1 + a2);
      console.log("=====================");
      console.log(a1 * 3);
      console.log(a3 * 3); // 알아서 숫자를 문자로 변환
      console.log(a1 + a2 + a3); // 숫자의 계산 후 문자가 오니 숫자는 숫자끼리 계산하고 문자는 문자열로 숫자 뒤에 붙음
      console.log(a1 * a2 * a3); // 곱셈은 또 숫자로 계산 = 문자가 곱셈을 만나면 곱셈이 됨
      console.log("=====================");
      console.log(typeof (a2 + "")); // = 문자
      console.log(typeof (a3 * 1)); // = 숫자
    </script>
  </head>
  <body>
    <script>
      // 여기에 스크립트를 작성하세요
    </script>
  </body>
</html>
