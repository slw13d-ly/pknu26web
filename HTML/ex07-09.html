<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블리언</title>
    <script>
      const b1 = !true; // ! → 논리 부정 연산자
      const b2 = !!true; // Boolean(), Number(), String()
      const b3 = !!"안녕";
      const b4 = !!"";
      const b5 = 123 == "123"; // 비교
      const b6 = 123 === "123"; // 타입까지 비교
      console.log(b1);
      console.log(b2);
      console.log(b3);
      console.log(b4);
      console.log(b5);
      console.log(b6);
    </script>
  </head>
  <body>
    <script>

    </script>
  </body>
</html>
