<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>불연산자</title>
    <script>
      console.log("불연산자");
      console.log(
        "%c불연산자",
        "border: 1px solid red;background-color: yellow;color: blue;font-size: 2rem;",
      );
      console.log("%c==============================", "color: yellow");
      console.log("true && true = " + (true && true));
      console.log("true && false = ", true && false);
      console.log("false && true = ", false && true); //false가 나오면 뒤도 안보고 false, false는 누구와 만나도 false
      console.log("false && false = ", false && false); //false가 나오면 뒤도 안보고 false, false는 누구와 만나도 false
      console.log("%c==============================", "color: yellow");
      console.log("true || true = ", true || true);
      console.log("true || false = ", true || false);
      console.log("false || true = ", false || true);
      console.log("false || false = ", false || false);
    </script>
  </head>
  <body>
    <script>
      // 여기에 스크립트를 작성하세요
    </script>
  </body>
</html>
