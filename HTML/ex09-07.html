<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <script>
      const todo = ["우유 구매"];
      //    todo = [];
      todo[1] = "커피구매";
      todo.push("저녁식사"); // py: todo.append()
      todo.push("일찍자기"); // py: todo.append()
      console.log(todo);
      /* slice : 문자열, 배열에서 원하는 부분만 잘라 새로운 값을 반환하는 함수 - 원본은 두고 일부부만 복사해 반환*/
      console.log(todo, todo.slice(0, 2)); //py: todo[0:2]

      /* splice : 배열에서 요소를 잘라내고 추가하고 교체하는 함수 - 결과와 원본 둘 다 변화를 줌*/
      console.log(todo);
      // todo.splice(start, deletCount, item1, item2 ...)
      todo.splice(0, 0, "꿈꾸기"); // 추가됨
      todo.splice(1, 2, "수술1", "수술2", "수술3"); // 수정됨
      //   todo.splice(1, 2); // 삭제
      todo.splice(-1, 0, "끝"); // 끝에 추가
      console.log(todo);
    </script>
  </body>
</html>
