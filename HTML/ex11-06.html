<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssText</title>
    <script></script>
  </head>
  <body>
    <h1 style="font-size: 2rem; text-align: end; color: blue">
      cssText의 속성을 알아보자!
    </h1>
    <button>값 읽어오기</button>
    <button>초기화</button>
    <button>스타일1</button>
    <button>스타일2</button>
    <p></p>
    <script>
      const h1 = document.querySelector("h1");
      const p = document.querySelector("p");
      const btns = document.querySelectorAll("button");
      // querySelectorAll로 같은 태그들을 다 잡아서 NodeList(: DOM에서 여러 요소를 담는 유사배열) 생성

      btns[0].addEventListener("click", () => {
        p.textContent = h1.style.cssText;
      }); // h1의 값을 뽑아내는 장치

      btns[1].addEventListener("click", () => {
        h1.style.cssText = "font-size: 2rem; text-align: end; color: blue";
      }); // h1의 값을 덮어씀
      btns[2].addEventListener("click", () => {
        h1.style.cssText =
          "font-size: 1.5rem; text-align: start; color: tomato";
      }); // h1의 값을 덮어씀
      btns[3].addEventListener("click", () => {
        h1.style.cssText = "font-size: 2.5rem; text-align: end; color: green";
      }); // h1의 값을 덮어씀
    </script>
  </body>
</html>
