  <body>
    arr.reduce((<mark>누적값</mark>, 현재값, 인덱스, 배열) => { return
    <mark>누적값</mark>
    }, 초기값 )
    <script>
      const arr = [11, 22, 33, 44, 55];

      const result = arr.reduce((acc, cur, idx, ar) => {
        console.log(acc, cur, idx, ar);
        return acc + cur; // 뜯어서 조합해서 사용 가능하게
      }, 0);
      console.log(result);
    </script>
