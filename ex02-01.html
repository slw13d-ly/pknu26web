<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>input 기능</h1>
    <hr />
    <a href="index.html">홈으로</a>
    <form
      action="https://docs.google.com/forms/u/0/d/e/04901FAIpQLSdr574KqxTMjNpjD3sw0n6HYAO5_pjSO89g-uLbPM8x7u0j-w/formResponse"
      method="POST"
    >
      First name : <input type="text" name="entry.1935641716" /><br />
      Last name : <input type="text" name="entry.605835699" /><br />
      Age :
      <input
        type="number"
        min="12"
        max="20"
        value="15"
        step="1"
        name="entry.1085368149"
      />
      <br />

      <hr />
      아침식사 밥? :
      <input
        type="checkbox"
        name="entry.1427749362"
        value="밥을 먹는다."
        id=""
      />
      아침식사 빵? :
      <input
        type="checkbox"
        name="entry.1427749362"
        value="빵을 먹는다."
        id=""
        checked
      />
      <br />

      <hr />
      <!-- ({radio$:}input:radio+br)*4  -->
      학생인가요? <br />
      예 :<input
        type="radio"
        name="entry.1794571361"
        id=""
        value="예"
        checked
      />
      아니요 :<input
        type="radio"
        name="entry.1794571361"
        id=""
        value="아니요"
      />

      <hr />
      공부 잘하나요? <br />
      잘해요 :<input
        type="radio"
        name="entry.2014030703"
        id=""
        value="잘해요"
      />
      보통요 :<input
        type="radio"
        name="entry.2014030703"
        id=""
        checked
        value="보통요"
      />
      <br />
      <input type="submit" />
      <input type="reset" />
    </form>
  </body>
</html>
