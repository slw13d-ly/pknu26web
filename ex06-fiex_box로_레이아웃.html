<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex box</title>
    <!-- 부모에 속성을 부여해야 자식이 속성을 먹음!! -->
    <style>
      .box {
        width: 800px;
        height: 700px;
        display: flex;
        flex-direction: column;
        justify-items: stretch;
        /* align-items: flex-start; */
        /* align-items: flex-end; */
        /* align-items: stretch; */ /* height: 200px;로 div의 범위를 저장해두면 늘어나는게 안보임 */
      }
      .box > div {
        height: 100px;
        background-color: cadetblue;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box > div:nth-of-type(2) {
        height: 50px;
        background-color: gold;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .main {
        display: flex;
        flex: 1;
      }
      .main > div {
        background-color: beige;
        display: flex;
        flex-direction: row;
        flex: 1;
      }
      .main > div:nth-child(2) {
        flex: 3;
        background-color: burlywood;
      }
    </style>
  </head>
  <body>
    <h1>fiex box로 레이아웃 만들기</h1>
    <hr />
    <a href="index.html">홈으로</a><br />
    <div class="box">
      <div>Never</div>
      <div>nav</div>
      <div class="main">
        <div>aside</div>
        <div>article</div>
        <div>section</div>
      </div>
      <div>정보처리방침 정책고객센터 Never corp.</div>
    </div>
  </body>
</html>
