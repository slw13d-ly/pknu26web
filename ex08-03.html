<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>브라우저에 점수를 입력받아 학점 매기기</title>
    <script>
      const inp = Number(prompt("점수를 입력해주세요"));
      console.log(typeof inp, inp);

      if (inp > 100) {
        console.log("점수를 잘못 입력하셨습니다.");
        alert("점수를 잘못 입력하셨습니다.");
        document.write(`<h3>점수를 잘못 입력하셨습니다.<h3>`);
      } else if (inp <= 0 || inp > 100) {
        console.log("점수를 잘못 입력하셨습니다.");
        alert("점수를 잘못 입력하셨습니다.");
        document.write(`<h3>점수를 잘못 입력하셨습니다.<h3>`);
      } else {
        // 중첩 if문
        if (inp == 100) {
          console.log("A++학점입니다.");
          alert("A++학점입니다.");
          document.write(`<h3> ${inp}점 이므로 A++학점 입니다.<h3>`);
        } else if (90 <= inp < 100) {
          console.log("A학점입니다.");
          alert("A학점입니다.");
          document.write(`<h3> ${inp}점 이므로 A학점 입니다.<h3>`);
        } else if (80 <= inp < 90) {
          console.log("B학점입니다.");
          alert("B학점입니다.");
          document.write(`<h3> ${inp}점 이므로 B학점 입니다.<h3>`);
        } else if (70 <= inp < 80) {
          console.log("C학점입니다.");
          alert("C학점입니다.");
          document.write(`<h3> ${inp}점 이므로 C학점 입니다.<h3>`);
        } else if (60 <= inp < 70) {
          console.log("D학점입니다.");
          alert("D학점입니다.");
          document.write(`<h3> ${inp}점 이므로 D학점 입니다.<h3>`);
        } else {
          console.log("F학점입니다.");
          alert("F학점입니다.");
          document.write(`<h3> ${inp}점 이므로 F학점 입니다.<h3>`);
        }
      }
    </script>
  </head>
  <body></body>
</html>
