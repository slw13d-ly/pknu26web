<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>호이스팅</title>
  </head>
  <body>
    <script>
      /* 변수 호이스팅 */
      console.log(1, num); // 선언되지 않은 애들을 오류 나지 않게
      var num = 1234;
      // let num1 = 5678;
      console.log(2, num);

      /* 함수 호이스팅 */ // 선언식
      console.log(abc());
      function abc(v) {
        let bb = "나는 밤양갱";
        return bb;
      }

      const abcc = (v) => "나는 꿀양갱"; // 표현식
      console.log(abcc());
    </script>
  </body>
</html>
