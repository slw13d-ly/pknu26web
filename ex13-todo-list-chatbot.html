<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>투두리스트 + 챗봇</title>

    <style>
      /* 전체 페이지 기본 스타일 */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 30px;
      }

      /* 중앙 컨테이너 */
      .container {
        width: 500px;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        border: 1px solid #ccc;
      }

      h1 {
        text-align: center;
      }

      /* 입력창 스타일 */
      input {
        width: 84%;
        padding: 8px;
        margin-right: 5px;
      }

      /* 버튼 기본 스타일 */
      button {
        padding: 8px 10px;
        cursor: pointer;
      }

      /* 리스트 스타일 제거 */
      ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
      }

      /* 리스트 항목 스타일 */
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: #eee;
        margin-bottom: 10px;
        padding: 10px;
      }

      /* 체크박스 크기 */
      li input[type="checkbox"] {
        margin: 0;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* 리스트 텍스트 영역 확장 */
      li > div:first-child {
        flex: 1;
      }

      /* 버튼 영역 */
      .btn-area {
        margin-left: auto;
      }

      .btn-area button {
        margin-right: 5px;
      }

      /* 완료된 항목 스타일 */
      .done {
        text-decoration: line-through;
        color: gray;
      }

      /* ================= 챗봇 관련 스타일 ================= */

      /* 챗봇 열기 버튼 */
      #openChat {
        margin-left: 10px;
        padding: 6px 12px;
        border: none;
        border-radius: 8px;
        background-color: cadetblue;
        color: white;
        cursor: pointer;
      }

      /* 챗봇 모달 (화면 전체) */
      .modal {
        display: none; /* 기본 숨김 */
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
      }

      /* 모달 내부 콘텐츠 위치 */
      .modal-content {
        position: absolute;
        right: 20px;
        bottom: 20px;
      }

      /* 모달 닫기 버튼 */
      #closeChat {
        position: absolute;
        top: -35px;
        right: 0;
        font-size: 28px;
        font-weight: bold;
        color: white;
        cursor: pointer;
      }

      /* 챗봇 박스 */
      .box {
        width: 360px;
        height: 600px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 챗봇 메시지 리스트 */
      .chat-container {
        list-style: none;
        margin: 0;
        padding: 15px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto; /* 스크롤 가능 */
      }

      /* 챗봇 메시지 기본 스타일 */
      .message {
        display: flex;
        flex-direction: column;
        max-width: 70%;
        position: relative;
      }

      /* 메시지 이름(보낸 사람) */
      .name {
        font-size: 12px;
        margin-bottom: 3px;
        color: gray;
      }

      /* 메시지 말풍선 */
      .bubble {
        padding: 10px 12px;
        border-radius: 12px;
        line-height: 1.4;
        word-break: break-word;
      }

      /* 봇 메시지 */
      .bot {
        align-self: flex-start;
      }
      .bot .bubble {
        background-color: #eee;
      }

      /* 사용자 메시지 */
      .user {
        align-self: flex-end;
        text-align: right;
      }
      .user .bubble {
        background-color: cadetblue;
        color: white;
      }

      /* 완료 처리된 메시지 */
      .box .done .bubble {
        text-decoration: line-through;
        opacity: 0.5;
      }

      /* 메시지 버튼 영역 */
      .actions {
        margin-top: 5px;
      }
      .actions button {
        font-size: 11px;
        margin-left: 5px;
        padding: 3px 6px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      /* 수정/삭제 버튼 */
      .edit-btn {
        background-color: #ffd966;
      }
      .delete-btn {
        background-color: #ff6b6b;
        color: white;
      }

      /* 입력창 영역 */
      .input-area {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        gap: 10px;
      }

      .input-area input {
        flex: 1;
        width: auto;
        padding: 10px;
        margin-right: 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
      }

      .input-area button {
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        background-color: cadetblue;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- ================= 투두리스트 영역 ================= -->
    <div class="container">
      <h1>
        과제
        <button id="openChat" type="button">챗봇</button>
      </h1>

      <input type="text" id="textInput" placeholder="내용을 입력하세요" />

      <button onclick="addItem()">추가</button>

      <ul id="list"></ul>
    </div>

    <!-- ================= 챗봇 모달 영역 ================= -->
    <div id="chatModal" class="modal">
      <div class="modal-content">
        <span id="closeChat">&times;</span>

        <div class="box">
          <ul class="chat-container" id="chat">
            <!-- 초기 봇 메시지 -->
            <li class="message bot">
              <div class="name">myBot</div>
              <div class="bubble">안녕하세요! 무엇을 도와드릴까요? 😊</div>
            </li>
          </ul>

          <!-- 메시지 입력창 -->
          <div class="input-area">
            <input type="text" id="input" placeholder="메시지 입력..." />
            <button id="send" type="button">전송</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ================= 투두리스트 기능 =================
      let items = []; // 투두리스트 데이터를 담을 배열

      // 페이지가 열리면 localStorage에서 저장된 데이터를 불러오기
      window.onload = function () {
        let savedItems = localStorage.getItem("items");
        if (savedItems) {
          items = JSON.parse(savedItems); // 문자열을 배열로 변환
        }
        renderList(); // 화면에 표시
      };

      // 데이터 저장
      function saveItems() {
        localStorage.setItem("items", JSON.stringify(items));
      }

      // 리스트 렌더링
      function renderList() {
        let list = document.getElementById("list");
        list.innerHTML = ""; // 기존 내용 초기화

        // 배열 순회
        for (let i = 0; i < items.length; i++) {
          let li = document.createElement("li"); // li 생성
          let text = document.createElement("div"); // 내용 div 생성
          text.innerText = items[i];

          // 체크박스 생성
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";

          li.appendChild(checkbox);

          // 체크박스 체크 시 완료 처리
          checkbox.addEventListener("change", () => {
            li.classList.toggle("done", checkbox.checked);
          });

          // li 클릭 시 체크박스 토글
          li.addEventListener("click", (e) => {
            if (e.target !== checkbox && e.target.tagName !== "BUTTON") {
              checkbox.checked = !checkbox.checked;
              li.classList.toggle("done", checkbox.checked);
            }
          });

          // 수정/삭제 버튼 영역
          let btnArea = document.createElement("div");
          btnArea.className = "btn-area";

          // 수정 버튼
          let editBtn = document.createElement("button");
          editBtn.innerText = "수정";
          editBtn.onclick = function () {
            editItem(i);
          };

          // 삭제 버튼
          let deleteBtn = document.createElement("button");
          deleteBtn.innerText = "삭제";
          deleteBtn.onclick = function () {
            deleteItem(i);
          };

          // 버튼 추가
          btnArea.appendChild(editBtn);
          btnArea.appendChild(deleteBtn);

          // li에 내용과 버튼 추가
          li.appendChild(text);
          li.appendChild(btnArea);

          // ul에 li 추가
          list.appendChild(li);
        }
      }

      // 데이터 추가
      function addItem() {
        let input = document.getElementById("textInput");
        let value = input.value.trim();

        if (value === "") {
          alert("내용을 입력하세요");
          return;
        }

        items.push(value); // 배열에 추가
        saveItems(); // 저장
        renderList(); // 화면에 렌더링
        input.value = ""; // 입력창 초기화
      }

      // 데이터 수정
      function editItem(index) {
        let newValue = prompt("수정할 내용을 입력하세요", items[index]);
        if (newValue === null) return; // 취소 시 종료
        newValue = newValue.trim();
        if (newValue === "") {
          alert("빈 값으로 수정할 수 없습니다");
          return;
        }
        items[index] = newValue; // 수정 적용
        saveItems();
        renderList();
      }

      // 데이터 삭제
      function deleteItem(index) {
        let check = confirm("정말 삭제하시겠습니까?");
        if (check) {
          items.splice(index, 1); // 배열에서 삭제
          saveItems();
          renderList();
        }
      }

      // ================= 챗봇 기능 =================

      // 모달 제어
      const modal = document.getElementById("chatModal");
      const openBtn = document.getElementById("openChat");
      const closeBtn = document.getElementById("closeChat");

      // 챗봇 열기
      openBtn.addEventListener("click", () => {
        modal.style.display = "block";
      });

      // 챗봇 닫기
      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });

      // 모달 외부 클릭 시 닫기
      window.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });

      const chat = document.getElementById("chat"); // 챗봇 메시지 ul
      const input = document.getElementById("input"); // 챗봇 입력창
      const sendBtn = document.getElementById("send"); // 전송 버튼

      // ================= 메시지 추가 함수 =================
      function addMessage(text, id = Date.now(), save = true) {
        const li = document.createElement("li");
        li.className = "message user"; // 사용자 메시지
        li.dataset.id = id; // 고유 ID

        // 메시지 HTML
        li.innerHTML = `
          <div class="name">나</div>
          <div class="bubble">${text}</div>
          <div class="actions">
            <button class="edit-btn" type="button">수정</button>
            <button class="delete-btn" type="button">삭제</button>
          </div>
        `;

        // 완료 토글 (li 클릭 시)
        li.addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") return; // 버튼 클릭 무시
          li.classList.toggle("done");
          updateStorage();
        });

        // 수정 버튼
        li.querySelector(".edit-btn").addEventListener("click", () => {
          const currentText = li.querySelector(".bubble").textContent;
          const newText = prompt("수정할 내용을 입력하세요", currentText);
          if (!newText) return;
          li.querySelector(".bubble").textContent = newText;
          updateStorage();
        });

        // 삭제 버튼
        li.querySelector(".delete-btn").addEventListener("click", () => {
          li.remove();
          updateStorage();
        });

        chat.appendChild(li);
        chat.scrollTop = chat.scrollHeight; // 스크롤 항상 아래로

        // 로컬스토리지 저장
        if (save) {
          const data = JSON.parse(localStorage.getItem("chat")) || [];
          data.push({ id, text });
          localStorage.setItem("chat", JSON.stringify(data));
        }
      }

      // ================= 메시지 전송 =================
      function sendMessage() {
        if (!input.value.trim()) return; // 공백 무시
        addMessage(input.value);
        input.value = ""; // 입력 초기화
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage(); // Enter로 전송
      });

      // ================= 페이지 로드 시 저장된 챗봇 메시지 불러오기 =================
      window.addEventListener("DOMContentLoaded", () => {
        const saved = JSON.parse(localStorage.getItem("chat")) || [];
        saved.forEach((msg) => {
          addMessage(msg.text, msg.id, false); // 저장하지 않고 렌더링
        });
      });

      // ================= 전체 메시지 로컬스토리지 업데이트 =================
      function updateStorage() {
        const messages = document.querySelectorAll(".message.user");
        const arr = [];
        messages.forEach((li) => {
          arr.push({
            id: li.dataset.id,
            text: li.querySelector(".bubble").textContent,
          });
        });
        localStorage.setItem("chat", JSON.stringify(arr));
      }
    </script>
  </body>
</html>
