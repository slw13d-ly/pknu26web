<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WELCOME - Red Ball</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }

      .welcome-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: bold;
        color: white;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        z-index: 10;
      }

      .ball {
        position: absolute;
        width: 60px;
        height: 60px;
        background: radial-gradient(circle at 30% 30%, #ff6b6b, #c70000);
        border-radius: 50%;
        box-shadow:
          inset -10px -10px 20px rgba(0, 0, 0, 0.3),
          5px 5px 15px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      .ball::after {
        content: "";
        position: absolute;
        top: 20%;
        left: 20%;
        width: 30px;
        height: 30px;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.8),
          transparent
        );
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="welcome-text">WELCOME</div>

    <script>
      // 빨간색 공이 돌아다니는 효과
      function createBall() {
        const ball = document.createElement("div");
        ball.className = "ball";
        document.body.appendChild(ball);

        // 랜덤 위치와 속도 설정
        let x = Math.random() * (window.innerWidth - 60);
        let y = Math.random() * (window.innerHeight - 60);
        let vx = (Math.random() - 0.5) * 4;
        let vy = (Math.random() - 0.5) * 4;

        // 벽에 닿으면 반사
        const bounce = () => {
          if (vx > 0 && x >= window.innerWidth - 60) vx = -Math.abs(vx);
          if (vx < 0 && x <= 0) vx = Math.abs(vx);
          if (vy > 0 && y >= window.innerHeight - 60) vy = -Math.abs(vy);
          if (vy < 0 && y <= 0) vy = Math.abs(vy);
        };

        let animationId;

        const moveBall = () => {
          x += vx;
          y += vy;

          bounce();

          ball.style.transform = `translate(${x}px, ${y}px)`;

          animationId = requestAnimationFrame(moveBall);
        };

        moveBall();

        // 30 초 후 공을 제거
        setTimeout(() => {
          ball.remove();
        }, 30000);
      }

      // 화면마다 공을 생성하고 제거
      setInterval(createBall, 5000);

      // 초기에 공 하나 생성
      createBall();
    </script>
  </body>
</html>
