<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React - CDN 방식</title>

    <!-- React SDK (CDN) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- ReactDOM (CDN) -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-server.edge.js"></script>

    <!-- Babel (JSX 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const text = "반가워요";
      const num = 12345;

      function MyApp() {
        return (
          <main>
            <h1>리액트를 처음 써봅니다.</h1>
            <p>어떤 내용을 여기에 넣어볼게요.</p>
            <h2>이 내용이에요.{text}</h2>
            <h3>{num * 10}개에요.</h3>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<MyApp />);
    </script>
  </body>
</html>
