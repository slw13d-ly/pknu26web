<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React - CDN 방식</title>

    <!-- React SDK (CDN) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- ReactDOM (CDN) -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-server.edge.js"></script>

    <!-- Babel (JSX 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const App = () => {
        const [count, setCount] = useState(0); // [count, setCount] -> count : 값을 읽어옴 / setCount : 읽어온 값을 가져옴
        const [text, setText] = useState("안녕");

        return (
          <main>
            <h1>JSX와 useState</h1>
            <p>버튼을 누르면 상태가 바뀐다. 화면이 다시 렌더링됩니다.</p>

            <h2>현재 값: {count}</h2>
            <h2>현재 값: {text}</h2>

            <button
              onClick={() => {
                if (count < 20) setCount(count + 1);
              }}
            >
              1 증가
            </button>

            <button onClick={() => setCount(Math.max(0, count - 1))}>
              1 감소
            </button>

            <hr />

            <button onClick={() => setText(text + "하세요.")}>존대</button>
            <button onClick={() => setText("어라!")}>어라 버튼</button>
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
