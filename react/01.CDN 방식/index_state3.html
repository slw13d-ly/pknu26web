<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React - CDN 방식</title>

    <!-- React SDK (CDN) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- ReactDOM (CDN) -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-server.edge.js"></script>

    <!-- Babel (JSX 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const App = () => {
        const [count, setCount] = useState(0);

        const handleCount = () => {
          setCount(count + 1);
          setCount(count + 1);
          setCount(count + 1);
        };

        const handleCountV = () => {
          setCount((prev) => prev + 1);
          setCount((prev) => prev + 1);
          setCount((prev) => prev + 1);
        };

        return (
          <main>
            <h1>useState 의 prev 방식</h1>
            <p>버튼을 누르면 상태가 바뀐다. 화면이 다시 렌더링됩니다.</p>
            <h2>현재 값: {count}</h2>
            <button onClick={handleCount}>증가</button>
            <button onClick={handleCountV}>Prev 증가</button>
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
